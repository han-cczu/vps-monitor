name: release

# 推一个 v 开头的 tag 就发版：
#   git tag v0.1.0 && git push origin v0.1.0
#
# 产出两样：推到 GHCR 的服务端镜像，以及挂在 GitHub Release 上的 agent 二进制。
# 面板自己也会托管一份 agent（镜像里带着，服务端启动时同步到数据卷），
# Release 资产是给「不想经面板、直接 wget」的场景留的。

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 创建 Release
  packages: write # 推 GHCR

jobs:
  image:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vps-monitor-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          # 面板跑在 x86 的香港小鸡上。要装到 arm 机器上再加 linux/arm64——
          # 多架构构建要起 QEMU，时间大概翻三倍，没用到就别开。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  agent:
    name: 交叉编译 agent 并挂到 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            agent/go.sum
            server/go.sum

      - name: 交叉编译两个架构
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          mkdir -p dist/agent
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
              -o "dist/agent/vps-agent-linux-$arch" ./agent/cmd/agent
          done
          cp agent/install.sh agent/uninstall.sh dist/agent/
          cd dist/agent && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/agent/*
          generate_release_notes: true
